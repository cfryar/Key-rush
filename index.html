<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Key Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0e1016;--panel:#171a22;--line:#262a35;--text:#ece9e4;--dim:#5d6472;--accent:#f2b84b;--bad:#ff5c6a;--good:#5fd48a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
  .app{width:100%;max-width:900px;display:flex;flex-direction:column}
  #game{position:relative;width:100%;height:min(42vh,470px);min-height:230px;overflow:hidden;cursor:text}
  canvas{display:block;width:100%;height:100%}
  .hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px;font-family:'JetBrains Mono',monospace}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .pill{background:rgba(10,12,18,.62);backdrop-filter:blur(4px);border-radius:10px;padding:6px 10px;font-weight:700}
  .pos{font:900 26px Inter,sans-serif;letter-spacing:-.02em}
  .pos small{font-size:12px;color:#c9c5bd;font-weight:600;margin-left:6px}
  .prog{position:absolute;left:12px;right:12px;top:58px;height:6px;background:rgba(10,12,18,.55);border-radius:4px}
  .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #0e1016}
  .flag{position:absolute;right:-4px;top:-9px;font-size:14px}
  .speedo{position:absolute;left:12px;bottom:10px}
  .speedo .n{font-size:40px;font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
  .speedo .u{font-size:12px;color:#ddd;margin-left:4px}
  .nitro{position:absolute;right:12px;bottom:12px;font:900 15px Inter,sans-serif;color:#0e1016;background:var(--accent);
    padding:5px 10px;border-radius:8px;opacity:0;transform:scale(.8);transition:.2s}
  .nitro.on{opacity:1;transform:scale(1)}
  .flash{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s}
  .flash.bad{background:rgba(255,60,80,.28);opacity:1;transition:none}
  .typebox{background:var(--panel);border-top:1px solid var(--line);padding:16px 16px 14px;position:relative;cursor:text}
  .wordsline{font-family:'JetBrains Mono',monospace;display:flex;align-items:baseline;gap:14px;overflow:hidden;white-space:nowrap;min-height:46px}
  .cur{font-size:34px;font-weight:700;padding:0 6px;border-radius:8px;transition:background .2s}
  .cur.good{background:rgba(95,212,138,.18)}
  .cur .c{color:#8a909c}.cur .ok{color:#fff}.cur .no{color:var(--bad)}.cur .x{color:#a33a45}
  .cur .caret{display:inline-block;width:2px;height:30px;background:var(--accent);vertical-align:-4px;margin:0 -1px;animation:blink 1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .next{font-size:20px;color:var(--dim)}
  .sub{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--dim);font-weight:600}
  .sub b{color:var(--text)}
  .hint{color:var(--accent)}
  #hidden{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,9,13,.6);backdrop-filter:blur(3px);z-index:10}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 22px;width:100%;max-width:420px;text-align:center}
  h1{margin:0;font:900 40px Inter,sans-serif;letter-spacing:-.04em}
  h1 span{color:var(--accent)}
  .tag{color:#a8a39b;margin:6px 0 20px;font-size:15px;line-height:1.4}
  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{display:flex;justify-content:space-between;align-items:center;background:#1f232d;border:1px solid var(--line);color:var(--text);
    border-radius:12px;padding:13px 16px;font:700 16px Inter,sans-serif;cursor:pointer;text-align:left}
  .opt:hover{border-color:var(--accent)}
  .opt small{display:block;font-weight:500;color:var(--dim);font-size:13px;margin-top:2px}
  .opt .best{font:600 12px 'JetBrains Mono',monospace;color:var(--accent)}
  .res h2{margin:0;font:900 32px Inter,sans-serif}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}
  .grid div{background:#1f232d;border-radius:12px;padding:10px}
  .grid .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:700}
  .grid .v{font:700 24px 'JetBrains Mono',monospace;color:var(--accent);margin-top:2px}
  .pb{color:var(--accent);font-weight:700;min-height:20px;margin-bottom:14px}
  .row{display:flex;gap:10px}
  .btn{flex:1;background:var(--accent);color:#14161b;border:0;border-radius:12px;padding:13px;font:800 15px Inter,sans-serif;cursor:pointer}
  .btn.alt{background:#1f232d;color:var(--text);border:1px solid var(--line)}
  .hide{display:none!important}
  @media (max-width:520px){.cur{font-size:28px}.next{font-size:17px}.speedo .n{font-size:32px}}
</style>
</head>
<body>
<div class="app">
  <div id="game">
    <canvas id="cv"></canvas>
    <div class="flash" id="flash"></div>
    <div class="hud">
      <div class="top">
        <div class="pill pos" id="pos">1st<small id="gap"></small></div>
        <div class="pill" id="clock">0.00s</div>
      </div>
      <div class="prog"><div class="dot" id="dRival" style="background:#ff5c6a;left:0"></div><div class="dot" id="dYou" style="background:#f2b84b;left:0"></div><span class="flag">🏁</span></div>
      <div class="speedo"><span class="n" id="mph">0</span><span class="u">MPH</span></div>
      <div class="nitro" id="nitro">🔥 NITRO</div>
    </div>
  </div>
  <div class="typebox" id="typebox">
    <div class="wordsline" id="wordsline"></div>
    <div class="sub"><span id="hint" class="hint">Type the first word to launch</span><span>Streak <b id="streak">0</b> · WPM <b id="wpm">0</b></span></div>
    <input id="hidden" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  </div>
</div>

<div class="overlay" id="menu">
  <div class="card">
    <h1>Key<span>Rush</span></h1>
    <p class="tag">Every word you type right makes you faster. Miss one and you skid. 8 in a row lights up nitro. First to the 1-mile flag wins.</p>
    <div class="opts" id="opts"></div>
  </div>
</div>

<div class="overlay hide" id="results">
  <div class="card res">
    <h2 id="rTitle">You win!</h2>
    <div class="grid">
      <div><div class="l">Your time</div><div class="v" id="rTime">0</div></div>
      <div><div class="l">Rival time</div><div class="v" id="rRival">0</div></div>
      <div><div class="l">WPM</div><div class="v" id="rWpm">0</div></div>
      <div><div class="l">Accuracy</div><div class="v" id="rAcc">0</div></div>
    </div>
    <div class="pb" id="rPb"></div>
    <div class="row"><button class="btn" id="again">Race again</button><button class="btn alt" id="change">Change rival</button></div>
  </div>
</div>

<script>
const WORDS=("the be to of and a in that have it for not on with he as you do at this but his by from they we say her she or an will my one all would there their what so up out if about who get which go me when make can like time no just him know take people into year your good some could them see other than then now look only come its over think also back after use two how our work first well way even new want because any these give day most us life world hand part child eye woman place week case point number group problem fact house home water room mother area money story month lot right study book job word business issue side kind head far black long both little very still own leave great old big high different small large next early young important few public bad same able last never start city run move play turn live believe hold bring happen write provide sit stand lose pay meet include continue set learn change lead understand watch follow stop create speak read allow add spend grow open walk win offer remember love consider appear buy wait serve send expect build stay fall cut reach remain suggest raise pass sell require report decide pull music friend light coffee phone street plan dream river night school family table door voice heart field road paper simple quick sound clear free sure ready blue green summer winter morning always drive fast race turbo engine wheel brake gear track speed").split(" ");
const RIVALS=[
  {id:"easy",name:"Sunday Driver",desc:"Cruises around 50 mph",mph:50,color:"#5fb0ff",dark:"#2f6fae"},
  {id:"med",name:"Commuter",desc:"Holds about 70 mph",mph:70,color:"#ff5c6a",dark:"#a8323d"},
  {id:"hard",name:"Speed Demon",desc:"Pushes 95 mph",mph:95,color:"#b36bff",dark:"#6e3bb0"}
];
const $=id=>document.getElementById(id);
const cv=$("cv"),ctx=cv.getContext("2d"),input=$("hidden");
const SEG=200,ROADW=1200,CAMH=1000,CAMD=0.84,PLAYERZ=CAMH*CAMD,CAMX=600,DRAW=140,CARW=520,UPM=30;
const UNITS_PER_M=UPM/0.447, TRACK=1609*UNITS_PER_M, FINISH_SEG=Math.floor(TRACK/SEG);
let W=0,H=0;
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}

// ---------- state ----------
let state="menu",rival=RIVALS[1];
let p=0,speed=0,pending=0,r=0,rspeed=0,rivalTime=0,elapsed=0,shake=0,skyOff=0;
let words=[],idx=0,cur="",streak=0,keys=0,good=0,correctChars=0;

function randWords(n){const a=[];for(let i=0;i<n;i++){let w;do{w=WORDS[Math.floor(Math.random()*WORDS.length)]}while(a.length&&w===a[a.length-1]);a.push(w)}return a}

function newRace(rv){
  rival=rv||rival; state="ready";
  p=0;speed=0;pending=0;r=0;rspeed=0;rivalTime=0;elapsed=0;shake=0;
  words=randWords(150);idx=0;cur="";streak=0;keys=0;good=0;correctChars=0;
  input.value="";
  $("menu").classList.add("hide");$("results").classList.add("hide");
  $("hint").textContent="Type the first word to launch";$("hint").classList.add("hint");
  renderWords();focusInput();
}
function startRace(){state="racing";$("hint").textContent=`Racing the ${rival.name}`;$("hint").classList.remove("hint")}

// ---------- input ----------
input.addEventListener("input",()=>{
  if(state!=="ready"&&state!=="racing"){input.value="";return}
  const v=input.value;
  if(state==="ready"){if(!v.trim()){input.value="";return}startRace()}
  const w=words[idx];
  if(v.length>cur.length){for(let k=cur.length;k<v.length;k++){const ch=v[k];if(ch===" ")continue;keys++;if(ch===w[k])good++}}
  if(v.includes(" ")){
    const parts=v.split(" "),t=parts[0],rest=parts.slice(1).join("");
    if(t)commit(t);
    input.value=rest;cur=rest;
  }else cur=v.slice(0,w.length+8);
  renderWords();
});
function commit(t){
  const w=words[idx];keys++;
  if(t===w){
    good++;correctChars+=w.length+1;streak++;
    let b=26*(w.length+1)/5;if(streak>=8)b*=1.3;pending+=b;
    const c=$("wordsline").querySelector(".cur");if(c){c.classList.add("good");}
  }else{
    speed*=0.6;pending=0;streak=0;shake=16;
    const f=$("flash");f.classList.add("bad");requestAnimationFrame(()=>requestAnimationFrame(()=>f.classList.remove("bad")));
  }
  idx++;if(idx>words.length-20)words.push(...randWords(100));
}
function renderWords(){
  const w=words[idx]||"",t=cur;let h="";
  for(let k=0;k<Math.max(w.length,t.length);k++){
    if(k===t.length)h+='<span class="caret"></span>';
    if(k<w.length)h+=`<span class="${k<t.length?(t[k]===w[k]?"ok":"no"):"c"}">${w[k]}</span>`;
    else h+=`<span class="x">${t[k]}</span>`;
  }
  if(t.length>=Math.max(w.length,t.length))h+='<span class="caret"></span>';
  $("wordsline").innerHTML=`<span class="cur">${h}</span><span class="next">${words.slice(idx+1,idx+6).join(" ")}</span>`;
}
function focusInput(){input.focus({preventScroll:true})}
$("game").addEventListener("click",focusInput);$("typebox").addEventListener("click",focusInput);
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){showMenu();return}
  if(state==="done"&&e.key==="Enter"){e.preventDefault();newRace();return}
  if((state==="ready"||state==="racing")&&document.activeElement!==input&&e.key.length===1)focusInput();
});

// ---------- menu / results ----------
function fmt(s){return s.toFixed(2)+"s"}
function showMenu(){
  state="menu";input.blur();
  $("opts").innerHTML=RIVALS.map(rv=>{const b=parseFloat(store("kr_best_"+rv.id)||"0");
    return `<button class="opt" data-id="${rv.id}"><span>${rv.name}<small>${rv.desc}</small></span><span class="best">${b?"best "+fmt(b):""}</span></button>`}).join("");
  $("results").classList.add("hide");$("menu").classList.remove("hide");
}
$("opts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)newRace(RIVALS.find(x=>x.id===b.dataset.id))});
$("again").addEventListener("click",()=>newRace());
$("change").addEventListener("click",showMenu);

function finish(dnf){
  state="done";input.blur();
  const rT=rivalTime||(elapsed+(TRACK-r)/(rival.mph*UPM));
  const won=!dnf&&elapsed<=rT;
  $("rTitle").textContent=dnf?"⏱ Out of time":won?"🏆 You win!":`😤 ${rival.name} wins`;
  $("rTime").textContent=dnf?"DNF":fmt(elapsed);$("rRival").textContent=fmt(rT);
  $("rWpm").textContent=Math.round(correctChars/5/(elapsed/60));
  $("rAcc").textContent=(keys?Math.round(good/keys*100):0)+"%";
  let msg="";
  if(!dnf){const k="kr_best_"+rival.id,prev=parseFloat(store(k)||"0");
    if(!prev||elapsed<prev){store(k,elapsed.toFixed(2));msg=prev?`🎉 New best vs ${rival.name}! (was ${fmt(prev)})`:"🎉 First time saved as your best";}
    else msg=`Your best vs ${rival.name}: ${fmt(prev)}`;}
  $("rPb").textContent=msg;
  setTimeout(()=>{$("results").classList.remove("hide");$("again").focus()},700);
}

// ---------- update ----------
function update(dt){
  if(state==="racing"){
    elapsed+=dt;
    const take=pending*Math.min(1,dt*5);speed+=take;pending-=take;
    speed-=speed*0.25*dt;if(speed<0.3)speed=0;if(speed>220)speed=220;
    const target=rival.mph*(1+0.07*Math.sin(elapsed*0.6));
    rspeed+=(target-rspeed)*Math.min(1,dt*0.7);
    r+=rspeed*UPM*dt;p+=speed*UPM*dt;
    if(r>=TRACK&&!rivalTime)rivalTime=elapsed;
    if(p>=TRACK)finish(false);else if(elapsed>180)finish(true);
  }else if(state==="done"){
    speed=Math.max(0,speed-speed*1.2*dt-4*dt);p+=speed*UPM*dt;
    rspeed=Math.max(0,rspeed-rspeed*1.2*dt);r+=rspeed*UPM*dt;
  }
  skyOff+=curveAt(Math.floor(p/SEG))*speed*dt*0.12;
  shake*=Math.pow(0.02,dt);
}
function updateHud(){
  $("mph").textContent=Math.round(speed);
  $("clock").textContent=fmt(elapsed);
  const ahead=p>=r;$("pos").firstChild.textContent=ahead?"1st":"2nd";
  const gap=Math.abs(p-r)/UNITS_PER_M;$("gap").textContent=state==="racing"&&gap>1?(ahead?"+":"−")+Math.round(gap)+"m":"";
  $("dYou").style.left=Math.min(100,p/TRACK*100)+"%";$("dRival").style.left=Math.min(100,r/TRACK*100)+"%";
  $("dRival").style.background=rival.color;
  $("nitro").classList.toggle("on",streak>=8&&state==="racing");
  $("streak").textContent=streak;
  $("wpm").textContent=elapsed>1?Math.round(correctChars/5/(elapsed/60)):0;
}

// ---------- render ----------
function curveAt(i){return 3.2*Math.sin(i*0.02)*Math.max(0,Math.sin(i*0.0071+0.5))}
function quad(x1,y1,w1,x2,y2,w2,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1-w1,y1);ctx.lineTo(x1+w1,y1);ctx.lineTo(x2+w2,y2);ctx.lineTo(x2-w2,y2);ctx.closePath();ctx.fill()}
function rr(x,y,w,h,rad){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,rad):ctx.rect(x,y,w,h);ctx.fill()}
function hills(hy,off,col,amp,f){ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,hy);
  for(let x=0;x<=W+8;x+=8){const X=x+off;ctx.lineTo(x,hy-amp*(0.55+0.45*Math.sin(X*f))*(0.6+0.4*Math.sin(X*f*0.37+2)))}
  ctx.lineTo(W,hy);ctx.closePath();ctx.fill()}
function checker(a,b){const n=10;for(let k=0;k<n;k++){
  const f1=-1+2*k/n,f2=-1+2*(k+1)/n;ctx.fillStyle=(k+a.i)%2?"#111":"#f4f4f4";ctx.beginPath();
  ctx.moveTo(a.x+a.w*f1,a.y);ctx.lineTo(a.x+a.w*f2,a.y);ctx.lineTo(b.x+b.w*f2,b.y);ctx.lineTo(b.x+b.w*f1,b.y);ctx.closePath();ctx.fill()}}
function tree(x,y,s){const h=1500*s,w=720*s;if(h<2)return;
  ctx.fillStyle="#5a3d2b";ctx.fillRect(x-w*0.07,y-h*0.25,w*0.14,h*0.25);
  ctx.fillStyle="#1f5130";ctx.beginPath();ctx.moveTo(x-w/2,y-h*0.22);ctx.lineTo(x,y-h*0.75);ctx.lineTo(x+w/2,y-h*0.22);ctx.fill();
  ctx.fillStyle="#2a6b3d";ctx.beginPath();ctx.moveTo(x-w*0.38,y-h*0.5);ctx.lineTo(x,y-h);ctx.lineTo(x+w*0.38,y-h*0.5);ctx.fill()}
function car(cx,by,w,col,dark,nitro){
  const h=w*0.62;ctx.save();ctx.translate(cx,by);
  ctx.fillStyle="rgba(0,0,0,.35)";ctx.beginPath();ctx.ellipse(0,-h*0.03,w*0.56,h*0.08,0,0,7);ctx.fill();
  ctx.fillStyle="#0d0d10";rr(-w*0.47,-h*0.28,w*0.16,h*0.28,w*0.03);rr(w*0.31,-h*0.28,w*0.16,h*0.28,w*0.03);
  ctx.fillStyle=dark;ctx.beginPath();ctx.moveTo(-w*0.38,-h*0.58);ctx.lineTo(-w*0.28,-h*0.95);ctx.lineTo(w*0.28,-h*0.95);ctx.lineTo(w*0.38,-h*0.58);ctx.fill();
  ctx.fillStyle="#1b2230";ctx.beginPath();ctx.moveTo(-w*0.31,-h*0.62);ctx.lineTo(-w*0.24,-h*0.89);ctx.lineTo(w*0.24,-h*0.89);ctx.lineTo(w*0.31,-h*0.62);ctx.fill();
  ctx.fillStyle=col;rr(-w*0.5,-h*0.62,w,h*0.46,w*0.08);
  ctx.fillStyle="rgba(255,255,255,.18)";rr(-w*0.46,-h*0.6,w*0.92,h*0.06,w*0.03);
  ctx.fillStyle="#ff3b3b";rr(-w*0.46,-h*0.5,w*0.19,h*0.1,w*0.02);rr(w*0.27,-h*0.5,w*0.19,h*0.1,w*0.02);
  ctx.fillStyle="#eee";rr(-w*0.09,-h*0.42,w*0.18,h*0.1,w*0.015);
  ctx.fillStyle="rgba(0,0,0,.4)";rr(-w*0.5,-h*0.24,w,h*0.07,w*0.02);
  if(nitro){for(const sx of[-0.22,0.22]){const L=h*(0.35+Math.random()*0.35);
    ctx.fillStyle="#ff7a1a";ctx.beginPath();ctx.moveTo(w*sx-w*0.05,-h*0.2);ctx.lineTo(w*sx,-h*0.2+L);ctx.lineTo(w*sx+w*0.05,-h*0.2);ctx.fill();
    ctx.fillStyle="#ffe066";ctx.beginPath();ctx.moveTo(w*sx-w*0.025,-h*0.2);ctx.lineTo(w*sx,-h*0.2+L*0.55);ctx.lineTo(w*sx+w*0.025,-h*0.2);ctx.fill()}}
  ctx.restore()}

function render(){
  ctx.save();
  if(shake>0.5)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake*0.6);
  const hy=H*0.42,camZ=p-PLAYERZ,vs=H-hy;
  const g=ctx.createLinearGradient(0,0,0,hy);g.addColorStop(0,"#1c2547");g.addColorStop(0.65,"#7c4a7a");g.addColorStop(1,"#f39a6a");
  ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,hy+21);
  ctx.fillStyle="rgba(255,214,140,.9)";ctx.beginPath();ctx.arc(W*0.7-skyOff*0.05,hy-hy*0.28,Math.min(W,H)*0.07,0,7);ctx.fill();
  hills(hy,skyOff*0.4,"#4a3560",hy*0.32,0.011);hills(hy,skyOff,"#2c2342",hy*0.18,0.02);
  ctx.fillStyle="#2b6435";ctx.fillRect(-20,hy,W+40,H-hy+20);

  const base=Math.floor(camZ/SEG),frac=(camZ-base*SEG)/SEG;
  const pts=[];let x=0,dx=-curveAt(base)*frac;
  for(let n=0;n<=DRAW;n++){const i=base+n,rel=Math.max(i*SEG-camZ,20),sc=CAMD/rel;
    pts.push({i,xw:x,sc,x:W/2+sc*(x-CAMX)*W/2,y:hy+sc*CAMH*vs,w:sc*ROADW*W/2});x+=dx;dx+=curveAt(i)}
  for(let n=DRAW-1;n>=0;n--){const a=pts[n],b=pts[n+1];if(b.y>=a.y)continue;const alt=Math.floor(a.i/3)%2;
    ctx.fillStyle=alt?"#2b6435":"#275c31";ctx.fillRect(-20,b.y,W+40,a.y-b.y+1);
    quad(a.x,a.y,a.w*1.12,b.x,b.y,b.w*1.12,alt?"#eeeeee":"#d2393b");
    quad(a.x,a.y,a.w,b.x,b.y,b.w,alt?"#53545c":"#4d4e56");
    if(a.i===FINISH_SEG||a.i===FINISH_SEG+1||a.i===0)checker(a,b);
    else if(alt)quad(a.x,a.y,a.w*0.025,b.x,b.y,b.w*0.025,"#f2d14b");}

  // sprites
  const spr=[],k=W/2;
  for(let n=1;n<DRAW;n++){const a=pts[n];if(a.i%7===0&&a.i>=0)for(const s of[-1,1])
    spr.push({z:a.i*SEG-camZ,draw:()=>tree(W/2+a.sc*(a.xw+s*ROADW*1.9-CAMX)*k,a.y,a.sc*k/1000*1.6)})}
  const pw=Math.min(0.001*CARW*k,H*0.4),fac=pw/(0.001*CARW*k);
  const rel=r-camZ;
  if(rel>60&&rel<DRAW*SEG*0.98){const fn=(r-base*SEG)/SEG,n=Math.floor(fn),t=fn-n;
    if(n>=0&&n<DRAW){const xw=pts[n].xw+(pts[n+1].xw-pts[n].xw)*t,sc=CAMD/rel;
      spr.push({z:rel,draw:()=>car(W/2+sc*(xw-600-CAMX)*k,hy+sc*CAMH*vs,sc*CARW*k*fac,rival.color,rival.dark,false)})}}
  spr.sort((a,b)=>b.z-a.z).forEach(s=>s.draw());

  // speed lines
  if(speed>85){ctx.strokeStyle=`rgba(255,255,255,${Math.min(.5,(speed-85)/200)})`;ctx.lineWidth=2;
    for(let i=0;i<14;i++){const left=i%2,x0=left?Math.random()*W*0.22:W-Math.random()*W*0.22,y0=hy+Math.random()*vs;
      const vx=x0-W/2,vy=y0-hy,L=20+Math.random()*50,m=Math.hypot(vx,vy);
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x0+vx/m*L,y0+vy/m*L);ctx.stroke()}}

  const bounce=speed>5?Math.sin(performance.now()/40)*1.2:0;
  car(W/2,H-6+bounce,pw,"#f2b84b","#b9862a",streak>=8&&state==="racing");
  ctx.restore();
}

// ---------- loop ----------
function resize(){const b=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);
  W=b.width;H=b.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0)}
window.addEventListener("resize",resize);
let last=performance.now();
function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;update(dt);render();updateHud();requestAnimationFrame(loop)}
resize();words=randWords(150);renderWords();showMenu();requestAnimationFrame(loop);
</script>
</body>
